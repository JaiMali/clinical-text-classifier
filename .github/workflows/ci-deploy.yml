name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clinical-text-classifier

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q -m "not integration"

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository_owner }}/clinical-text-classifier:latest
            docker pull "$IMAGE"
            docker rm -f ctc 2>/dev/null || true
            docker run -d --name ctc --restart unless-stopped \
              -p 80:8000 \
              -v /opt/clinical-text-classifier/model:/app/model_output/final:ro \
              "$IMAGE"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/health >/dev/null 2>&1; then
                echo "healthy"; docker image prune -f; exit 0
              fi
              sleep 2
            done
            echo "health check failed"; docker logs --tail 50 ctc; exit 1
